name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: zypper --non-interactive install gcc ca-certificates-mozilla git autoconf automake libtool make curl tar xz

      - name: Install Nim via choosenim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
        env:
          CHOOSENIM_CHOOSE_VERSION: stable

      - name: Build wolfSSL from source
        run: |
          git clone --depth 1 --branch v5.7.6-stable https://github.com/wolfSSL/wolfssl.git /tmp/wolfssl
          cd /tmp/wolfssl
          ./autogen.sh
          CFLAGS="-Wno-error=return-mismatch" ./configure --enable-sni --prefix=/usr
          make -j$(nproc) CFLAGS="-Wno-error=return-mismatch"
          make install
          ldconfig

      - name: Install Nimble dependencies
        run: nimble install -y --depsOnly

      - name: Build (dynamic)
        run: nim c --path:src src/wolfssl.nim

      - name: Build (static)
        run: nim c -d:wolfsslStatic --path:src src/wolfssl.nim

      - name: Tier 1 — binding validation
        run: nim c -r --path:src tests/t_bindings.nim

      - name: Tier 2 — TLS integration
        run: nim c -r --path:src tests/t_tls_client.nim
